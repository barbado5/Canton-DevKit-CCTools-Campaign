name: Canton DevKit LocalNet token demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localnet-token-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEVKIT_VERSION: v0.18.2-cctools.1
      INSTANCE: cctools-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install campaign build and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="canton-devkit_${DEVKIT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/bitdynamics-ab/canton-devkit/releases/download/${DEVKIT_VERSION}"
          expected_sha256="3bdb17ec18ed3115329072261bf431409fa7f0b19f46e6919a47a547ce5ef012"
          curl -fsSL -o "${asset}" "${base}/${asset}"
          echo "${expected_sha256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}"
          chmod +x canton-devkit
          sudo install -m 0755 canton-devkit /usr/local/bin/canton-devkit
          canton-devkit version | tee devkit-version.txt
          grep -q "v0.18.2-cctools.1" devkit-version.txt
          grep -q "CCT-" devkit-version.txt

      - name: Check runner prerequisites
        run: |
          docker version
          docker compose version
          df -h
          free -h
          canton-devkit localnet doctor

      - name: Start campaign LocalNet
        run: canton-devkit localnet up "${INSTANCE}"

      - name: Create and mint demo token
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== Campaign build ==="
            canton-devkit version
            echo "=== LocalNet status ==="
            canton-devkit localnet status "${INSTANCE}"
            echo "=== Create demo instrument and mint initial supply ==="
            canton-devkit localnet token demo --instance "${INSTANCE}"
            echo "=== Verify token balances ==="
            canton-devkit localnet token balances --instance "${INSTANCE}"
          } 2>&1 | tee canton-devkit-token-demo.log

      - name: Preserve demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canton-devkit-cctools-demo-evidence
          path: |
            devkit-version.txt
            canton-devkit-token-demo.log
            /home/runner/.canton-devkit/campaign-id
          if-no-files-found: warn
          retention-days: 7

      - name: Remove LocalNet resources
        if: always()
        run: |
          if command -v canton-devkit >/dev/null 2>&1; then
            canton-devkit localnet remove --name "${INSTANCE}" --force || true
          fi
